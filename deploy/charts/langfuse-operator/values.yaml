# Default values for langfuse-operator.

replicaCount: 1

image:
  repository: ghcr.io/palenaai/langfuse-operator
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Whether to create the ServiceAccount
  create: true
  # Annotations to add to the ServiceAccount
  annotations: {}
  # Name override; defaults to fullname
  name: ""

# Leader election ensures only one replica reconciles at a time
leaderElection:
  enabled: true

# Health and readiness probe bind address
healthProbeBindAddress: ":8081"

# Operator log level: debug, info, error, or a zap verbosity integer.
# The binary is built with zap development mode on, which would otherwise log at
# debug — most of that volume is per-probe circuit-breaker and health-check
# lines. Set to debug when diagnosing an instance; empty leaves the built-in
# default alone.
logLevel: info

# Log encoding: json or console. Development mode would otherwise pick console,
# which prefixes each line with a tab-separated timestamp and level and renders
# only the fields as JSON — close enough to fool a log shipper expecting one
# object per line. Set console for readable kubectl logs; empty leaves the
# built-in default alone.
logFormat: json

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Comma-separated list of namespaces to watch.
# If empty, the operator watches all namespaces (cluster-scoped).
# Example: "langfuse,langfuse-staging"
watchNamespaces: ""

# Additional environment variables for the manager container
extraEnv: []

# Additional volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Pod annotations
podAnnotations: {}

# Pod labels (in addition to the default labels)
podLabels: {}
